# Railway / Nixpacks: Python API + build React into Django static files.
providers = ["python", "node"]

[variables]
NIXPACKS_NODE_VERSION = "20"
NPM_CONFIG_PRODUCTION = "false"

[phases.setup]
# "..." keeps the Python provider packages; nodejs_20 adds npm for the SPA build.
nixPkgs = ["...", "nodejs_20"]

[phases.build]
cmds = [
  "npm ci --prefix front-end",
  "npm run build:django --prefix front-end",
]
