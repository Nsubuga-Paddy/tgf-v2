<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Password Changed - MCS</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        :root { --brand: #ff6b00; --brand-hover: #e55f00; --bg: #f8f5f1; --ink: #1f2937; --muted: #6b7280; --border: #e5e7eb; }
        body { min-height: 100vh; background: radial-gradient(circle at top, rgba(255, 107, 0, 0.16), transparent 38%), var(--bg); color: var(--ink); display: flex; align-items: center; justify-content: center; padding: 1.5rem 1rem; }
        .auth-card { width: min(480px, 100%); border: 1px solid var(--border); border-radius: 1rem; overflow: hidden; box-shadow: 0 18px 45px rgba(31, 41, 55, 0.12); background: #fff; }
        .auth-header { background: var(--brand); color: #fff; padding: 1.15rem 1.35rem; display: flex; align-items: center; gap: 0.85rem; }
        .auth-header img { width: 44px; height: 44px; object-fit: contain; border-radius: 0.75rem; background: rgba(255, 255, 255, 0.16); padding: 0.35rem; }
        .auth-header h1 { margin: 0; font-size: 1.35rem; font-weight: 700; }
        .auth-header p { margin: 0.1rem 0 0; font-size: 0.85rem; opacity: 0.9; }
        .auth-body { padding: 1.35rem; text-align: center; }
        .btn-primary { background-color: var(--brand); border-color: var(--brand); font-weight: 700; }
        .btn-primary:hover { background-color: var(--brand-hover); border-color: var(--brand-hover); }
    </style>
</head>
<body>
    <main class="auth-card">
        <header class="auth-header">
            <img src="mcs-logo2.svg" alt="">
            <div>
                <h1>Password changed</h1>
                <p>Your password reset is complete</p>
            </div>
        </header>
        <section class="auth-body">
            <p class="mb-3">Your password has been set. You can now log in with your new password.</p>
            <a href="/login" class="btn btn-primary">Log in</a>
        </section>
    </main>
</body>
</html>
