<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <title>Login - MCS</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        :root {
            --brand: #ff6b00;
            --brand-hover: #e55f00;
            --bg: #f8f5f1;
            --ink: #1f2937;
            --muted: #6b7280;
            --border: #e5e7eb;
        }

        body {
            min-height: 100vh;
            background: radial-gradient(circle at top, rgba(255, 107, 0, 0.16), transparent 38%), var(--bg);
            color: var(--ink);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem 1rem;
        }

        .login-card {
            width: min(480px, 100%);
            border: 1px solid var(--border);
            border-radius: 1rem;
            overflow: hidden;
            box-shadow: 0 18px 45px rgba(31, 41, 55, 0.12);
            background: #fff;
        }

        .login-header {
            background: var(--brand);
            color: #fff;
            padding: 1.15rem 1.35rem;
            display: flex;
            align-items: center;
            gap: 0.85rem;
        }

        .login-header img {
            width: 44px;
            height: 44px;
            object-fit: contain;
            border-radius: 0.75rem;
            background: rgba(255, 255, 255, 0.16);
            padding: 0.35rem;
        }

        .login-header h1 {
            margin: 0;
            font-size: 1.35rem;
            font-weight: 700;
        }

        .login-header p {
            margin: 0.1rem 0 0;
            font-size: 0.85rem;
            opacity: 0.9;
        }

        .login-body {
            padding: 1.35rem;
        }

        .form-label {
            font-weight: 600;
            font-size: 0.88rem;
        }

        .form-control:focus {
            border-color: var(--brand);
            box-shadow: 0 0 0 0.2rem rgba(255, 107, 0, 0.16);
        }

        .btn-primary {
            background-color: var(--brand);
            border-color: var(--brand);
            font-weight: 700;
        }

        .btn-primary:hover,
        .btn-primary:focus {
            background-color: var(--brand-hover);
            border-color: var(--brand-hover);
        }

        .footer-links {
            text-align: center;
            margin-top: 1rem;
            color: var(--muted);
            font-size: 0.92rem;
        }

        .footer-links a {
            color: var(--brand);
            font-weight: 700;
            text-decoration: none;
        }

        .footer-links a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <main class="login-card">
        <header class="login-header">
            <img src="mcs-logo2.svg" alt="">
            <div>
                <h1>Login</h1>
                <p>Access your MCS member account</p>
            </div>
        </header>

        <section class="login-body">
            <form id="loginForm">
                <div class="mb-3">
                    <label for="username" class="form-label">Username <span class="text-danger">*</span></label>
                    <input type="text" name="username" id="username" class="form-control" required>
                </div>

                <div class="mb-4">
                    <label for="password" class="form-label">Password <span class="text-danger">*</span></label>
                    <input type="password" name="password" id="password" class="form-control" required>
                </div>

                <button class="btn btn-primary btn-lg w-100" type="submit">Login</button>
            </form>

            <div class="footer-links">
                <p class="mb-2"><a href="/forgot-password">Forgot password?</a></p>
                <p class="mb-2">Don't have an account? <a href="/signup">Sign up</a></p>
                <p class="mb-0"><a href="/help">Need help getting started? Visit the Help Center</a></p>
            </div>
        </section>
    </main>
</body>
</html>
