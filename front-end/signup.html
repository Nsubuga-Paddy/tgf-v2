<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <title>Sign Up - MCS</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        :root {
            --brand: #ff6b00;
            --brand-hover: #e55f00;
            --bg: #f8f5f1;
            --ink: #1f2937;
            --muted: #6b7280;
            --border: #e5e7eb;
        }

        body {
            min-height: 100vh;
            background: radial-gradient(circle at top, rgba(255, 107, 0, 0.16), transparent 38%), var(--bg);
            color: var(--ink);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem 1rem;
        }

        .signup-card {
            width: min(540px, 100%);
            border: 1px solid var(--border);
            border-radius: 1rem;
            overflow: hidden;
            box-shadow: 0 18px 45px rgba(31, 41, 55, 0.12);
            background: #fff;
        }

        .signup-header {
            background: var(--brand);
            color: #fff;
            padding: 1.15rem 1.35rem;
            display: flex;
            align-items: center;
            gap: 0.85rem;
        }

        .signup-header img {
            width: 44px;
            height: 44px;
            object-fit: contain;
            border-radius: 0.75rem;
            background: rgba(255, 255, 255, 0.16);
            padding: 0.35rem;
        }

        .signup-header h1 {
            margin: 0;
            font-size: 1.35rem;
            font-weight: 700;
        }

        .signup-header p {
            margin: 0.1rem 0 0;
            font-size: 0.85rem;
            opacity: 0.9;
        }

        .signup-body {
            padding: 1.35rem;
        }

        .form-label {
            font-weight: 600;
            font-size: 0.88rem;
        }

        .form-control:focus {
            border-color: var(--brand);
            box-shadow: 0 0 0 0.2rem rgba(255, 107, 0, 0.16);
        }

        .btn-primary {
            background-color: var(--brand);
            border-color: var(--brand);
            font-weight: 700;
        }

        .btn-primary:hover,
        .btn-primary:focus {
            background-color: var(--brand-hover);
            border-color: var(--brand-hover);
        }

        .help-text {
            color: var(--muted);
            font-size: 0.78rem;
        }

        .footer-links {
            text-align: center;
            margin-top: 1rem;
            color: var(--muted);
            font-size: 0.92rem;
        }

        .footer-links a {
            color: var(--brand);
            font-weight: 700;
            text-decoration: none;
        }

        .footer-links a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <main class="signup-card">
        <header class="signup-header">
            <img src="mcs-logo2.svg" alt="">
            <div>
                <h1>Sign Up</h1>
                <p>Create your MCS member account</p>
            </div>
        </header>

        <section class="signup-body">
            <form id="signupForm">
                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label for="firstName" class="form-label">First Name <span class="text-danger">*</span></label>
                        <input type="text" name="first_name" id="firstName" class="form-control" required>
                    </div>

                    <div class="col-md-6 mb-3">
                        <label for="lastName" class="form-label">Last Name <span class="text-danger">*</span></label>
                        <input type="text" name="last_name" id="lastName" class="form-control" required>
                    </div>
                </div>

                <div class="mb-3">
                    <label for="username" class="form-label">Username <span class="text-danger">*</span></label>
                    <input type="text" name="username" id="username" class="form-control" required>
                </div>

                <div class="mb-3">
                    <label for="email" class="form-label">Email <span class="text-danger">*</span></label>
                    <input type="email" name="email" id="email" class="form-control" required>
                </div>

                <div class="mb-3">
                    <label for="whatsappNumber" class="form-label">WhatsApp Number <span class="text-danger">*</span></label>
                    <input
                        type="tel"
                        name="whatsapp_number"
                        id="whatsappNumber"
                        class="form-control"
                        placeholder="+2567xxxxxxxx"
                        pattern="^\+[1-9][0-9]{7,14}$"
                        required
                    >
                    <div class="help-text mt-1">Must begin with a country code (e.g., +2567xxxxxxxx for Uganda)</div>
                </div>

                <div class="mb-3">
                    <label for="password1" class="form-label">Password <span class="text-danger">*</span></label>
                    <input type="password" name="password1" id="password1" class="form-control" required>
                </div>

                <div class="mb-4">
                    <label for="password2" class="form-label">Confirm Password <span class="text-danger">*</span></label>
                    <input type="password" name="password2" id="password2" class="form-control" required>
                </div>

                <button class="btn btn-primary btn-lg w-100" type="submit">Sign Up</button>
            </form>

            <div class="footer-links">
                <p class="mb-2">Already have an account? <a href="/login">Login</a></p>
                <p class="mb-0"><a href="/help">Watch tutorials in the Help Center</a></p>
            </div>
        </section>
    </main>
</body>
</html>
